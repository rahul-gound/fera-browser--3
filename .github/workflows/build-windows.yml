name: Build Fera-Search (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  win:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 🧹 Free space
      - name: Free disk space
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache" -ErrorAction SilentlyContinue

      # 📁 Output folder
      - name: Prepare output folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force downloadeds | Out-Null

      # 🦊 Install MozillaBuild
      - name: Install MozillaBuild
        shell: pwsh
        run: |
          $url = "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe"
          $installer = "$env:TEMP\MozillaBuildSetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/S", "/D=C:\mozilla-build" -Wait
          if (!(Test-Path "C:\mozilla-build\start-shell.bat")) { throw "MozillaBuild install failed" }

      # 🔧 ENV
      - name: Set MOZILLABUILD
        shell: pwsh
        run: |
          echo "MOZILLABUILD=C:\mozilla-build" >> $env:GITHUB_ENV

      # 🧠 Detect source folder
      - name: Detect source folder
        shell: pwsh
        run: |
          if (Test-Path "mach") {
            echo "SRC_DIR=$PWD" >> $env:GITHUB_ENV
          } else {
            $dir = Get-ChildItem -Recurse -Filter mach -File | Select-Object -First 1
            if (-not $dir) { throw "mach file not found!" }
            $folder = Split-Path $dir.FullName -Parent
            echo "SRC_DIR=$folder" >> $env:GITHUB_ENV
          }

      # 🧠 Bootstrap
      - name: Bootstrap
        shell: cmd
        run: |
          C:\mozilla-build\start-shell.bat -no-interactive -here -c "cd /d %SRC_DIR% && ./mach --no-interactive bootstrap"

      # 🔥 Build ONLY browser (IMPORTANT FIX)
      - name: Build Browser
        shell: cmd
        run: |
          C:\mozilla-build\start-shell.bat -no-interactive -here -c "cd /d %SRC_DIR% && ./mach build browser -j2"

      # 📦 Package
      - name: Package Browser
        shell: cmd
        run: |
          C:\mozilla-build\start-shell.bat -no-interactive -here -c "cd /d %SRC_DIR% && ./mach package"

      # 🔍 Debug output (helps if things break)
      - name: Debug output
        shell: pwsh
        run: |
          Write-Host "Listing EXE files..."
          Get-ChildItem -Path "$env:SRC_DIR" -Recurse -Include "*.exe" -ErrorAction SilentlyContinue

      # 📦 Collect REAL browser output
      - name: Collect artifacts (correct)
        shell: pwsh
        run: |
          $distPath = Get-ChildItem -Path "$env:SRC_DIR\obj-*" -Recurse -Directory -Filter "dist" | Select-Object -First 1

          if ($distPath) {
            $binPath = Join-Path $distPath.FullName "bin"
            if (Test-Path $binPath) {
              Copy-Item "$binPath\*" -Destination "downloadeds" -Recurse -Force
              Write-Host "✅ Browser files collected from $binPath"
            } else {
              Write-Host "⚠️ bin folder not found"
            }
          } else {
            Write-Host "⚠️ dist folder not found (build likely failed)"
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fera-search-windows
          path: downloadeds/
