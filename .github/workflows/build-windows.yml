name: Build Fera-Search (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  win:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 🧹 Free space (CRITICAL)
      - name: Free disk space
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache" -ErrorAction SilentlyContinue

      # 📁 Output folder
      - name: Prepare output folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force downloadeds | Out-Null

      # 🦊 Install MozillaBuild
      - name: Install MozillaBuild
        shell: pwsh
        run: |
          $url = "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe"
          $installer = "$env:TEMP\MozillaBuildSetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/S", "/D=C:\mozilla-build" -Wait
          if (!(Test-Path "C:\mozilla-build\start-shell.bat")) { throw "MozillaBuild install failed" }

      # 🔧 ENV
      - name: Set MOZILLABUILD
        shell: pwsh
        run: |
          echo "MOZILLABUILD=C:\mozilla-build" >> $env:GITHUB_ENV

      # ⚡ Cache
      - name: Cache mozbuild
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.mozbuild
            obj-*
          key: mozbuild-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            mozbuild-${{ runner.os }}-

      # 🧠 Detect correct source folder
      - name: Detect source folder
        id: detect
        shell: pwsh
        run: |
          if (Test-Path "mach") {
            echo "SRC_DIR=." >> $env:GITHUB_ENV
          } else {
            $dir = Get-ChildItem -Recurse -Filter mach -File | Select-Object -First 1
            if (-not $dir) { throw "mach file not found!" }
            $folder = Split-Path $dir.FullName -Parent
            echo "SRC_DIR=$folder" >> $env:GITHUB_ENV
          }

      # 🧠 Bootstrap
      - name: Bootstrap
        shell: cmd
        run: |
          C:\mozilla-build\start-shell.bat -no-interactive -here -c "cd /d %SRC_DIR% && ./mach --no-interactive bootstrap"

      # 🔨 Build (safe mode)
      - name: Build
        shell: cmd
        run: |
          C:\mozilla-build\start-shell.bat -no-interactive -here -c "cd /d %SRC_DIR% && ./mach build -j2"

      # 📦 Package
      - name: Package
        shell: cmd
        run: |
          C:\mozilla-build\start-shell.bat -no-interactive -here -c "cd /d %SRC_DIR% && ./mach package"

      # 📦 Collect output
      - name: Collect artifacts
        shell: pwsh
        run: |
          $dist = Get-ChildItem -Directory -Path "$env:SRC_DIR\obj-*" -Filter "dist" -Recurse | Select-Object -First 1
          if (-not $dist) { throw "dist folder not found!" }
          Get-ChildItem -Path $dist.FullName -Recurse -Include "*.exe","*.zip","*.msi" |
            Copy-Item -Destination "downloadeds" -Force

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fera-search-windows
          path: downloadeds/
